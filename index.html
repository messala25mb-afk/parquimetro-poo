<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parquímetro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>🅿️ Parquímetro</h1>

    <p>Consulte abaixo os valores disponíveis.</p>

    <h2>Tabela de Permanência</h2>

    <table>

        <tr>
            <th>Valor</th>
            <th>Tempo</th>
        </tr>

        <tr>
            <td>R$ 1,00</td>
            <td>30 minutos</td>
        </tr>

        <tr>
            <td>R$ 1,75</td>
            <td>60 minutos</td>
        </tr>

        <tr>
            <td>R$ 3,00</td>
            <td>120 minutos</td>
        </tr>

    </table>

    <p><strong>Digite o valor pago:</strong></p>

    <input
        type="number"
        id="valor"
        placeholder="Digite o valor"
        step="0.01"
        min="0">

    <button id="calcular">
        Calcular
    </button>

    <div id="resultado"></div>

    <script src="scripts.js"></script>
    
</body>
</html>
